<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pouchwise logo variants</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2a44; --muted: #5c6b85; --card: #f3f6fb; --brand: #1E88E5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #e5e9f2; --muted: #a7b3c8; --card: #182134; } }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .tile { border-radius: 24%; display: grid; place-items: center; }
  .tile svg { width: 78%; height: 78%; display: block; }
  .light { background: #fff; color: #1f2a44; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .blue { background: var(--brand); color: #fff; }
  .dark { background: #1f2a44; color: #fff; }
  .big { width: 112px; height: 112px; }
  .small { width: 48px; height: 48px; }
  .cap { font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; }
  .group { margin: 28px 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<h1>Pouchwise — варианты иконки</h1>
<p class="sub">Линия 5 px на поле 108×108, как у adaptive icon. Каждый вариант показан на белом, на синем бренда и в мелком размере 48 px, чтобы проверить читаемость в списке приложений.</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- shared parts: open can and leaning lid, as on the reference picture -->
    <g id="can">
      <ellipse cx="42" cy="58" rx="30" ry="10"/>
      <path d="M12 58 V76 a30 10 0 0 0 60 0 V58"/>
    </g>
    <g id="lid" transform="rotate(-32 78 48)">
      <ellipse cx="78" cy="48" rx="22" ry="7"/>
      <path d="M56 48 v5 a22 7 0 0 0 44 0 v-5"/>
    </g>
    <!-- narrow, long pouch standing in the can -->
    <path id="pouch" d="M27.5 58 V26 a5.5 5.5 0 0 1 11 0 V58" transform="rotate(-10 33 58)"/>

    <!-- A: can + pouch + counting dots -->
    <symbol id="v-a" viewBox="0 0 108 108">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <use href="#pouch"/><use href="#can"/><use href="#lid"/>
        <circle cx="32" cy="69" r="3" fill="currentColor" stroke="none"/>
        <circle cx="42" cy="70" r="3" fill="currentColor" stroke="none"/>
        <circle cx="52" cy="69" r="3" stroke-width="2.5"/>
      </g>
    </symbol>

    <!-- B: can + pouch + leaf -->
    <symbol id="v-b" viewBox="0 0 108 108">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <use href="#pouch"/><use href="#can"/><use href="#lid"/>
        <path d="M38 24 C40 13 48 8 57 10 C55 19 49 24 38 24 Z"/>
        <path d="M41 22 L52 13" stroke-width="3.5"/>
      </g>
    </symbol>

    <!-- C: can + pouch + down arrow (reduction) -->
    <symbol id="v-c" viewBox="0 0 108 108">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <use href="#pouch"/><use href="#can"/><use href="#lid"/>
        <path d="M42 61 V74 M36 68.5 L42 74.5 L48 68.5"/>
      </g>
    </symbol>

    <!-- D: single long pouch with tally marks -->
    <symbol id="v-d" viewBox="0 0 108 108">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="41" y="16" width="26" height="76" rx="13"/>
        <g stroke-width="3.5">
          <path d="M47 42 V66 M51.7 42 V66 M56.3 42 V66 M61 42 V66"/>
          <path d="M44 70 L64 38"/>
        </g>
      </g>
    </symbol>

    <!-- E: clock whose hand is the pouch (pouch time) -->
    <symbol id="v-e" viewBox="0 0 108 108">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="54" cy="56" r="38"/>
        <path d="M54 22 v6 M54 84 v6 M20 56 h6 M82 56 h6" stroke-width="4"/>
        <path d="M49.5 56 V30 a4.5 4.5 0 0 1 9 0 V56 Z" transform="rotate(38 54 56)"/>
        <circle cx="54" cy="56" r="3" fill="currentColor" stroke="none"/>
      </g>
    </symbol>

    <!-- F: can lid from above with a tapering chart -->
    <symbol id="v-f" viewBox="0 0 108 108">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="54" cy="54" r="38"/>
        <rect x="35" y="37" width="9" height="34" rx="4.5"/>
        <rect x="49.5" y="48" width="9" height="23" rx="4.5"/>
        <rect x="64" y="59" width="9" height="12" rx="4.5"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="group">По мотивам вашей картинки</div>
<div class="grid" id="ref"></div>
<div class="group">Свои варианты</div>
<div class="grid" id="own"></div>

<script>
  const variants = {
    ref: [
      ['v-a', 'A · Банка и счёт', 'Открытая банка с узким длинным паучем, на корпусе три точки: две полные, одна пустая. «Осталось два из трёх» — идея лимита без цифр.'],
      ['v-b', 'B · Банка и лист', 'Та же банка, но из пауча растёт лист. Самый мягкий намёк на «ответственно» и перекличка с садом/деревьями из Snusless.'],
      ['v-c', 'C · Банка и стрелка вниз', 'Банка с паучем и стрелка вниз на корпусе: снижение. Самая прямолинейная метафора плана.'],
    ],
    own: [
      ['v-d', 'D · Пауч-зарубки', 'Один длинный пауч, внутри четыре зарубки и пятая наискосок. Приложение считает паучи — иконка и есть счётчик.'],
      ['v-e', 'E · Часы-пауч', 'Циферблат, стрелка которого — пауч. Про таймер «под губой» и про время, которое никотин живёт в организме.'],
      ['v-f', 'F · Крышка-график', 'Крышка банки сверху, внутри три убывающих столбика. Снижение по дням, как на экране History.'],
    ],
  };
  function tile(id, cls, size) {
    return `<div><div class="tile ${cls} ${size}"><svg><use href="#${id}"/></svg></div></div>`;
  }
  for (const [group, list] of Object.entries(variants)) {
    document.getElementById(group).innerHTML = list.map(([id, title, text]) => `
      <div class="card">
        <h2>${title}</h2>
        <p>${text}</p>
        <div class="row">
          ${tile(id, 'light', 'big')}
          ${tile(id, 'blue', 'big')}
          ${tile(id, 'blue', 'small')}
          ${tile(id, 'dark', 'small')}
        </div>
      </div>`).join('');
  }
</script>
</body>
</html>
