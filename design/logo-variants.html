<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pouchwise icon</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2a44; --muted: #5c6b85; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #e5e9f2; --muted: #a7b3c8; } }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; max-width: 640px; }
  img { max-width: 100%; height: auto; display: block; border-radius: 12px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .cap { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<h1>Pouchwise — иконка</h1>
<p class="sub">Исходник — ваш PNG без изменений в рисунке: белый фон убран, штрихи сделаны белыми, рисунок вписан в безопасную зону adaptive icon (66 из 108 dp). Слева направо: квадратная маска, круглая маска, размер 48 dp.</p>
<div class="row">
  <div><img src="icon-preview.png" alt="icon preview"><div class="cap">как в лаунчере</div></div>
  <div><img src="icon-source.png" alt="source" style="width:228px;background:#fff"><div class="cap">исходник</div></div>
</div>
</body>
</html>
