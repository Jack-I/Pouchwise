<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pouchwise icon</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2a44; --muted: #5c6b85; --card: #f3f6fb; --brand: #1E88E5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #e5e9f2; --muted: #a7b3c8; --card: #182134; } }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; max-width: 640px; }
  .row { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .tile { display: grid; place-items: center; }
  .tile svg { width: 78%; height: 78%; display: block; }
  .sq { border-radius: 24%; }
  .circle { border-radius: 50%; }
  .light { background: #fff; color: #111; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .blue { background: var(--brand); color: #fff; }
  .dark { background: #1f2a44; color: #fff; }
  .huge { width: 220px; height: 220px; }
  .big { width: 112px; height: 112px; }
  .small { width: 48px; height: 48px; }
  .cap { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<h1>Pouchwise — иконка</h1>
<p class="sub">По вашему референсу: открытая банка, прямоугольный пауч внутри, толстая крышка-диск опирается на край, на стенке зарубки 卌. Линия 5 px на поле 108×108. Круг — как Android обрежет adaptive icon.</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="icon" viewBox="0 0 108 108">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <!-- rectangular pouch standing in the can; its bottom hides behind the front rim -->
        <path d="M31 67 V21 a3 3 0 0 1 3 -3 H46 a3 3 0 0 1 3 3 V67" transform="rotate(-15 40 67)"/>
        <!-- open can -->
        <ellipse cx="44" cy="58" rx="30" ry="11"/>
        <path d="M14 58 V78 a30 11 0 0 0 60 0 V58"/>
        <!-- tally marks on the wall -->
        <path d="M36.5 73 V83 M41.5 73 V83 M46.5 73 V83 M51.5 73 V83" stroke-width="3.5"/>
        <path d="M33 84 L55 72" stroke-width="3.5"/>
        <!-- thick lid leaning on the rim -->
        <g transform="rotate(-35 87 43)">
          <ellipse cx="87" cy="43" rx="24" ry="9"/>
          <path d="M63 43 v7 a24 9 0 0 0 48 0 v-7"/>
        </g>
      </g>
    </symbol>
  </defs>
</svg>

<div class="row">
  <div><div class="tile light huge sq"><svg><use href="#icon"/></svg></div><div class="cap">220 px, на белом</div></div>
  <div><div class="tile blue big sq"><svg><use href="#icon"/></svg></div><div class="cap">112 px, цвет бренда</div></div>
  <div><div class="tile blue big circle"><svg><use href="#icon"/></svg></div><div class="cap">круглая маска</div></div>
  <div><div class="tile dark big sq"><svg><use href="#icon"/></svg></div><div class="cap">тёмная тема</div></div>
  <div><div class="tile blue small sq"><svg><use href="#icon"/></svg></div><div class="cap">48 px</div></div>
  <div><div class="tile light small circle"><svg><use href="#icon"/></svg></div><div class="cap">48 px</div></div>
</div>
</body>
</html>
